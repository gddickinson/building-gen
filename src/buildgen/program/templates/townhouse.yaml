# Georgian Townhouse Template
#
# Historical context: Built 1714-1830, following Palladian principles.
# Typically 2-4 bays wide, 3 stories + basement + attic.
# Deep narrow rectangular plan, often in terraces sharing party walls.
#
# Key Georgian conventions:
#   - Strict symmetry on the facade (windows align vertically in bays)
#   - Entrance to one side (off-centre) or central with flanking rooms
#   - Staircase rises from entrance hall at rear
#   - Principal rooms (parlour, drawing room) at front for street views
#   - Service rooms (kitchen, scullery) at rear or basement
#   - Chimneys on party walls (shared flues), fireplaces in main rooms
#   - Sash windows (6-over-6), proportioned ~1:1.6 (golden ratio)
#   - Servants' quarters in attic
#
# Room arrangement per floor:
#   Basement (optional): kitchen, scullery, wine cellar, coal store, servants' hall
#   Ground: entrance hall with stair, front parlour, rear dining/morning room
#   First (principal floor): drawing room (front), best bedroom or second reception
#   Second: bedrooms, dressing rooms
#   Attic: servants' bedrooms, storage

footprint:
  width: 8.5        # metres (3-bay frontage ~7-9.5m, wider allows proper room widths)
  width_var: 0.8
  depth: 11.0       # metres (depth:width ratio ~1.3-1.5)
  depth_var: 1.0
  wall_thickness: 0.35   # Brick, 1.5 brick thick for Georgian

floors:
  # ── GROUND FLOOR ──
  # Entrance hall runs side-to-rear with staircase.
  # Front parlour faces the street. Dining room at rear.
  # Closet under stairs. WC if later addition.
  - index: 0
    rooms:
      - name: entrance_hall
        type: entrance_hall
        min_area: 5.0
        max_area: 9.0
        area_var: 1.0
        min_aspect: 0.25    # Long narrow hall is OK
        needs_exterior_wall: true
        needs_window: false  # Front door + fanlight provides light

      - name: front_parlour
        type: parlour
        min_area: 16.0
        max_area: 22.0
        area_var: 2.0
        min_aspect: 0.5     # Should be roughly proportioned

      - name: dining_room
        type: dining_room
        min_area: 14.0
        max_area: 20.0
        area_var: 2.0

      - name: morning_room
        type: drawing_room
        min_area: 10.0
        max_area: 16.0
        area_var: 1.5
        optional: true
        probability: 0.4

      - name: closet_ground
        type: storage
        min_area: 1.5
        max_area: 3.0
        area_var: 0.5
        needs_exterior_wall: false
        needs_window: false
        optional: true
        probability: 0.6

      - name: kitchen
        type: kitchen
        min_area: 10.0
        max_area: 16.0
        area_var: 1.5

      - name: scullery
        type: scullery
        min_area: 4.0
        max_area: 8.0
        area_var: 1.0
        optional: true
        probability: 0.5

      - name: pantry
        type: pantry
        min_area: 2.0
        max_area: 4.0
        area_var: 0.5
        needs_exterior_wall: false
        needs_window: false
        optional: true
        probability: 0.5

    adjacencies:
      # Hall must connect to front parlour and dining room
      - { a: entrance_hall, b: front_parlour, type: must }
      - { a: entrance_hall, b: dining_room, type: should }
      # Kitchen at rear, connected to dining
      - { a: dining_room, b: kitchen, type: must }
      - { a: kitchen, b: scullery, type: must }
      - { a: kitchen, b: pantry, type: should }
      # Closet near hall
      - { a: entrance_hall, b: closet_ground, type: should }
      # Parlour should NOT connect directly to kitchen
      - { a: front_parlour, b: kitchen, type: must_not }

  # ── FIRST FLOOR (PRINCIPAL FLOOR) ──
  # Drawing room at front (grandest room in the house).
  # Best bedroom or second drawing room at rear.
  # Landing connects to all rooms.
  - index: 1
    rooms:
      - name: drawing_room
        type: drawing_room
        min_area: 18.0
        max_area: 26.0
        area_var: 2.0
        min_aspect: 0.5     # Well-proportioned

      - name: master_bedroom
        type: master_bedroom
        min_area: 14.0
        max_area: 22.0
        area_var: 2.0

      - name: dressing_room
        type: dressing_room
        min_area: 4.0
        max_area: 8.0
        area_var: 1.0
        needs_exterior_wall: false
        needs_window: false
        optional: true
        probability: 0.5

      - name: closet_1
        type: storage
        min_area: 1.0
        max_area: 2.5
        area_var: 0.3
        needs_exterior_wall: false
        needs_window: false
        optional: true
        probability: 0.5

      - name: landing_1
        type: landing
        min_area: 2.5
        max_area: 5.0
        area_var: 0.5
        needs_exterior_wall: false
        needs_window: false

    adjacencies:
      - { a: landing_1, b: drawing_room, type: must }
      - { a: landing_1, b: master_bedroom, type: must }
      - { a: master_bedroom, b: dressing_room, type: must }
      - { a: landing_1, b: closet_1, type: should }

  # ── SECOND FLOOR ──
  # Secondary bedrooms. Possibly a small bathroom (later addition).
  # Children's rooms, guest rooms.
  - index: 2
    rooms:
      - name: bedroom_2
        type: bedroom
        min_area: 12.0
        max_area: 18.0
        area_var: 2.0

      - name: bedroom_3
        type: bedroom
        min_area: 10.0
        max_area: 15.0
        area_var: 1.5

      - name: bedroom_4
        type: bedroom
        min_area: 8.0
        max_area: 12.0
        area_var: 1.5
        optional: true
        probability: 0.5

      - name: bathroom
        type: bathroom
        min_area: 3.5
        max_area: 6.0
        area_var: 0.5
        needs_exterior_wall: false
        needs_window: false

      - name: closet_2
        type: storage
        min_area: 1.0
        max_area: 2.0
        area_var: 0.3
        needs_exterior_wall: false
        needs_window: false
        optional: true
        probability: 0.6

      - name: landing_2
        type: landing
        min_area: 2.5
        max_area: 4.5
        area_var: 0.5
        needs_exterior_wall: false
        needs_window: false

    adjacencies:
      - { a: landing_2, b: bedroom_2, type: must }
      - { a: landing_2, b: bedroom_3, type: must }
      - { a: landing_2, b: bedroom_4, type: must }
      - { a: landing_2, b: bathroom, type: must }
      - { a: landing_2, b: closet_2, type: should }
      # Bathroom must not open onto bedrooms directly (via landing)
      - { a: bathroom, b: bedroom_2, type: must_not }
